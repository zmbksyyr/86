name: Daily build

on:
  schedule:
    # 06:00 Asia/Shanghai is 22:00 UTC on the previous day.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out aggregate repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build timestamp
        shell: pwsh
        run: |
          $chinaTimeZone = [TimeZoneInfo]::FindSystemTimeZoneById('China Standard Time')
          $buildTime = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $chinaTimeZone)
          "BUILD_TIMESTAMP=$($buildTime.ToString('yyyy-MM-dd-HHmmss'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clone and sync upstream repositories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cloneRoot = Join-Path $env:RUNNER_TEMP 'upstream'
          New-Item -ItemType Directory -Force -Path $cloneRoot | Out-Null
          $repositories = @(
            @{ Name = '86JP'; Url = 'https://gitgud.io/rewio/86JP.git' },
            @{ Name = '86JPGMTool'; Url = 'https://gitgud.io/rewio/86JPGMTool.git' },
            @{ Name = 'S4A12ClientPatch'; Url = 'https://gitgud.io/rewio/S4A12ClientPatch.git' },
            @{ Name = 'ServerS4A21'; Url = 'https://gitgud.io/rewio/ServerS4A21.git' },
            @{ Name = 'S4A21ClientPatch'; Url = 'https://gitgud.io/rewio/S4A21ClientPatch.git' },
            @{ Name = 'S4A21GmTool'; Url = 'https://gitgud.io/rewio/S4A21GmTool.git' }
          )

          foreach ($repository in $repositories) {
            $source = Join-Path $cloneRoot $repository.Name
            $destination = Join-Path $env:GITHUB_WORKSPACE $repository.Name
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & git clone --depth 1 $repository.Url $source
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw "Failed to clone $($repository.Name) after 3 attempts." }
              if (Test-Path $source) { Remove-Item $source -Recurse -Force }
              Start-Sleep -Seconds (5 * $attempt)
            }

            & robocopy $source $destination /MIR /XD '.git' /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8) { throw "Failed to sync $($repository.Name); robocopy exit code $LASTEXITCODE." }
          }

      - name: Commit synchronized source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @('86JP', '86JPGMTool', 'S4A12ClientPatch', 'ServerS4A21', 'S4A21ClientPatch', 'S4A21GmTool')
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add --force -- $projects
          $changes = @(& git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect synchronized source changes.' }
          if ($changes.Count -eq 0) {
            Write-Host 'Upstream source is already current.'
          } else {
            & git commit -m "Sync upstream source $env:BUILD_TIMESTAMP"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to commit synchronized source.' }
            & git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Failed to push synchronized source to main.' }
          }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish .NET applications
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Publish-App([string]$Project, [string]$Output, [bool]$SingleFile) {
            $Output = [IO.Path]::GetFullPath($Output)
            New-Item -ItemType Directory -Force -Path $Output | Out-Null
            $arguments = @(
              'publish', $Project,
              '-c', 'Release',
              '-r', 'win-x64',
              '--self-contained', 'true',
              "-p:PublishSingleFile=$($SingleFile.ToString().ToLowerInvariant())",
              '-p:IncludeNativeLibrariesForSelfExtract=true',
              '-o', $Output,
              '-nr:false', '-m:1'
            )
            & dotnet @arguments
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $Project" }
          }

          Publish-App '86JP/Server/DfoServer/DfoServer.csproj' 'release/86JP/DfoServer' $true
          Publish-App '86JP/Tool/PvfProxy/PvfProxy.csproj' 'release/86JP/PvfProxy' $true
          Publish-App '86JPGMTool/DfoGmTool.csproj' 'release/86JPGMTool' $false
          Publish-App 'ServerS4A21/Server/DfoServer/DfoServer.csproj' 'release/ServerS4A21/DfoServer' $true
          Publish-App 'ServerS4A21/Tool/PvfProxy/PvfProxy.csproj' 'release/ServerS4A21/PvfProxy' $true
          Publish-App 'S4A21GmTool/DfoGmTool.csproj' 'release/S4A21GmTool' $false

      - name: Build C++ client patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Build-Cpp([string]$Project, [string]$Platform, [string]$Output) {
            $Output = [IO.Path]::GetFullPath($Output)
            New-Item -ItemType Directory -Force -Path $Output | Out-Null
            & msbuild $Project /m /nologo /t:Rebuild /p:Configuration=Release /p:Platform=$Platform "/p:OutDir=$Output\"
            if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $Project" }
          }

          Build-Cpp '86JP/Patch/86JP.vcxproj' 'Win32' 'release/86JP/ClientPatch'
          Build-Cpp 'S4A12ClientPatch/86JP/86JP.sln' 'x86' 'release/S4A12ClientPatch/86JP'
          Build-Cpp 'S4A12ClientPatch/GameGaurd/GameGaurd.sln' 'x86' 'release/S4A12ClientPatch/GameGaurd'
          Build-Cpp 'S4A12ClientPatch/PreventMinimize/PreventMinimize.sln' 'x86' 'release/S4A12ClientPatch/PreventMinimize'
          Build-Cpp 'S4A21ClientPatch/ClientPatch.sln' 'x86' 'release/S4A21ClientPatch'

          Copy-Item 'S4A12ClientPatch/GameGaurd/GameGaurd.ini' 'release/S4A12ClientPatch/GameGaurd/' -Force
          Get-ChildItem 'S4A21ClientPatch' -Recurse -File -Filter '*.ini' |
            Copy-Item -Destination 'release/S4A21ClientPatch/' -Force

      - name: Create separate dated archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveRoot = Join-Path $env:GITHUB_WORKSPACE 'archives'
          New-Item -ItemType Directory -Force -Path $archiveRoot | Out-Null
          $projects = @('86JP', '86JPGMTool', 'S4A12ClientPatch', 'ServerS4A21', 'S4A21ClientPatch', 'S4A21GmTool')
          foreach ($project in $projects) {
            $source = Join-Path $env:GITHUB_WORKSPACE "release/$project"
            if (-not (Test-Path $source)) { throw "Release directory not found: $source" }
            $archive = Join-Path $archiveRoot "$project-$env:BUILD_TIMESTAMP.zip"
            Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          }

      - name: Move fixed release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & git tag --force daily-build HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to update local daily-build tag.' }
          & git push origin refs/tags/daily-build --force
          if ($LASTEXITCODE -ne 0) { throw 'Failed to update remote daily-build tag.' }

      - name: Remove old release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"

          $releases = Invoke-RestMethod -Headers $headers -Uri "$apiRoot/releases?per_page=100"
          foreach ($legacyRelease in @($releases | Where-Object { $_.tag_name -like 'build-*' })) {
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "$apiRoot/releases/$($legacyRelease.id)"
            $encodedTag = [Uri]::EscapeDataString([string]$legacyRelease.tag_name)
            try {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$apiRoot/git/refs/tags/$encodedTag"
            } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            }
          }

          try {
            $release = Invoke-RestMethod -Headers $headers -Uri "$apiRoot/releases/tags/daily-build"
            foreach ($asset in @($release.assets)) {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$apiRoot/releases/assets/$($asset.id)"
            }
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }

      - name: Update fixed GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily-build
          name: Daily build
          body: |
            Automated daily build from the latest upstream source.
            Target framework and dependencies: upstream project defaults
            Runtime: Windows x64
          files: archives/*.zip
          make_latest: true
          overwrite_files: true
