name: Publish DfoServer

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CHANNEL: '10.0'
  PROJECT: Server/DfoServer/DfoServer.csproj

jobs:
  publish:
    runs-on: codeberg-small
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel "$DOTNET_CHANNEL"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Build & package
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          for rid in win-x64; do
            echo "::group::Publishing ${rid}"
            dotnet publish "$PROJECT" \
              -c Release -r "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -o "out/${rid}/"
            echo "::endgroup::"

            case "$rid" in
              win-*) cp start-server.bat "out/${rid}/" ;;
              *)     cp start-server.sh "out/${rid}/"
                     chmod +x "out/${rid}/start-server.sh" "out/${rid}/DfoServer" ;;
            esac

            (cd "out/${rid}" && zip -r "../../dist/DfoServer-${version}-${rid}.zip" .)
            rm -rf "out/${rid}"
          done

      - name: Create release
        run: |
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          TOKEN="${{ github.token }}"
          TAG="${GITHUB_REF_NAME}"

          cat > /tmp/body.md << 'EOF'
          Self-contained server build (Windows x64).

          After extracting, place the client `Script.pvf` at `Data/Pvf/Script.pvf`, then run `start-server.bat`.

          Use `--server-ip auto` to advertise this machine's LAN IPv4 to the client.
          EOF

          rel_id=$(curl -sf -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "$TAG" \
              --arg name "DfoServer ${TAG}" \
              --arg body "$(cat /tmp/body.md)" \
              --arg target "${GITHUB_SHA}" \
              '{tag_name: $tag, name: $name, body: $body, prerelease: false, target_commitish: $target}')" \
            "${API}/releases" | jq -r '.id')

          echo "Created release #${rel_id}"

          for zip in dist/*.zip; do
            filename=$(basename "$zip")
            echo "Uploading ${filename}..."
            curl -sf -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${zip}" \
              "${API}/releases/${rel_id}/assets?name=${filename}"
            echo ""
          done
